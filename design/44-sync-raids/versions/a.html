  --gold: #ffd100; --white: #ffffff; --grey: #808080; --green: #1eff00; --red: #ff2020;
  --amber: #ffa020;
  --q-epic: #a335ee; --q-rare: #0070dd; --q-uncommon: #1eff00; --q-common: #ffffff;
  --raid: #ff7f00; --raid-leader: #ff4809; --raid-warning: #ff4800; --system: #ffff00; --party: #aaaaff;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; color: var(--white); }
body { font-family: "Friz", Georgia, serif; font-size: 13px; }

/* Prototype controls: clearly not part of the add-on */
.proto-bar {
  position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
  padding: 8px 12px; background: #f4f1e8; color: #1d1d1d; border-bottom: 3px solid #c43;
  font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.proto-bar strong { color: #a2261a; }
.proto-bar label { display: flex; gap: 6px; align-items: center; }
.proto-bar select, .proto-bar button { font: inherit; padding: 4px 8px; border: 1px solid #555; border-radius: 4px; background: #fff; color: #111; }
.proto-bar button:focus-visible, .proto-bar select:focus-visible { outline: 3px solid #1a5fd0; outline-offset: 1px; }
.proto-note { flex-basis: 100%; font-size: 13px; color: #444; }

/* The game screen */
.viewport { width: 100%; overflow: hidden; }
.scene {
  position: relative; width: 1440px; height: 900px; transform-origin: 0 0; overflow: hidden;
  background:
    radial-gradient(ellipse 60% 45% at 70% 80%, rgba(255,90,20,.35), transparent 70%),
    radial-gradient(ellipse 40% 30% at 20% 30%, rgba(160,40,10,.30), transparent 70%),
    radial-gradient(ellipse 90% 70% at 50% 50%, #2a120b 0%, #120806 60%, #050202 100%);
}
.scene::after { /* faint "game world" texture */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .18;
  background-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAACbSURBVHhe5cgxDQAACMAw/HvECwiYgy7ps/kWl1OSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5JTklOSU5ITMXuIcdDEzrZ1MwAAAABJRU5ErkJggg==);
}
.scene-caption { position: absolute; left: 20px; top: 14px; z-index: 2; color: rgba(255,255,255,.45); font: 12px system-ui, sans-serif; }

/* Text styles from the game */
.gold { color: var(--gold); } .white { color: var(--white); } .grey { color: var(--grey); }
.green { color: var(--green); } .red { color: var(--red); } .amber { color: var(--amber); }
.q-epic { color: var(--q-epic); } .q-rare { color: var(--q-rare); } .q-uncommon { color: var(--q-uncommon); }
.shadow, .frame, .chat, .tip, .btn, .tab { text-shadow: 1px 1px 0 #000; }
.small { font-size: 11px; } .narrow { font-family: "ArialN", "Arial Narrow", sans-serif; }
.c-warrior { color: #c79c6e; } .c-mage { color: #69ccf0; } .c-priest { color: #ffffff; } .c-rogue { color: #fff569; }
.c-druid { color: #ff7d0a; } .c-hunter { color: #abd473; } .c-warlock { color: #9482c9; } .c-paladin { color: #f58cba; }
.c-shaman { color: #0070de; }
.absent { color: var(--grey) !important; }
.struck { text-decoration: line-through; color: var(--grey) !important; }

.btn.big { min-height: 26px; font-size: 13px; padding: 0 16px; }
.btn.tiny { min-height: 19px; font-size: 11px; padding: 0 8px; }
.btn .ico { width: 16px; height: 16px; }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* Icons and slots */
.icon { display: inline-block; width: 36px; height: 36px; border: 1px solid #000; background-size: 112% 112%; background-position: center; flex: none; box-shadow: 0 0 0 1px #3a3a3a; }
.icon.s { width: 20px; height: 20px; } .icon.m { width: 28px; height: 28px; } .icon.l { width: 48px; height: 48px; }
.icon.border-epic { box-shadow: 0 0 0 1px var(--q-epic); } .icon.border-rare { box-shadow: 0 0 0 1px var(--q-rare); }
.dot { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; background-size: contain; }
.tick { color: var(--green); font-family: system-ui, sans-serif; }

/* Labels for loot modes */
.mode { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: 2px; border: 1px solid; font-family: "ArialN", sans-serif; font-weight: 700; white-space: nowrap; }
.mode.hr { color: #ff8b3d; border-color: #ff8b3d55; background: #ff8b3d18; }
.mode.sr { color: #5fc4ff; border-color: #5fc4ff55; background: #5fc4ff18; }
.mode.open { color: #d8d8d8; border-color: #d8d8d855; background: #ffffff10; }
.mode.db { color: #c69bff; border-color: #c69bff55; background: #c69bff18; }
.mode.warn { color: var(--amber); border-color: #ffa02066; background: #ffa02018; }
.mode.bad { color: #ff5a5a; border-color: #ff5a5a66; background: #ff5a5a18; }
.mode.ok { color: var(--green); border-color: #1eff0055; background: #1eff0012; }
.mode.practice { color: #ffd100; border-color: #ffd10066; background: #ffd10018; }

/* Dividers */
.hr-div { height: 1px; margin: 6px 0; background: linear-gradient(90deg, transparent, #ffd10055 15%, #ffd10055 85%, transparent); }

/* Dropdown (UIDropDownMenu look) */
.dd { display: inline-flex; align-items: center; gap: 6px; padding: 2px 6px 2px 8px; background: rgba(0,0,0,.5); border: 1px solid #555; border-radius: 2px; color: #fff; font: 12px "Friz", serif; cursor: pointer; white-space: nowrap; }
.dd::after { content: "▾"; color: var(--gold); }
.menu { position: absolute; z-index: 30; }
.menu .menu-title { color: var(--gold); font-family: "Friz", serif; font-size: 12px; margin-bottom: 3px; }
.menu .mi { display: flex; gap: 6px; align-items: center; padding: 1px 4px 1px 2px; white-space: nowrap; }
.menu .mi:hover, .menu .mi.sel { background: rgba(255,209,0,.18); }
.menu .mi .chk { width: 12px; color: var(--gold); }

/* Tables inside the window */
table.list { width: 100%; border-collapse: collapse; font-family: "ArialN", sans-serif; font-size: 14px; }
table.list th { color: var(--gold); font: 11px "Friz", serif; text-align: left; padding: 3px 6px; border-bottom: 1px solid #ffd10033; }
table.list td { padding: 4px 6px; vertical-align: middle; border-bottom: 1px solid #ffffff10; }
table.list tr.group td { padding-top: 9px; color: var(--gold); font: 13px "Friz", serif; border-bottom: 1px solid #ffd10044; }
table.list tr.hl td { background: rgba(255,160,32,.10); }
table.list tr.void td { opacity: .55; }
.item-cell { display: flex; align-items: center; gap: 6px; }

/* Chat frame */
.chat { position: absolute; left: 24px; top: 660px; width: 300px; z-index: 3; font: 14px/1.28 "ArialN", sans-serif; }
.chat-tab { display: inline-block; padding: 3px 12px 2px; background: rgba(0,0,0,.45); color: var(--gold); font: 11px "Friz", serif; border-radius: 3px 3px 0 0; }
.chat-body { background: rgba(0,0,0,.40); padding: 6px 8px; min-height: 120px; }
.chat-line { margin: 1px 0; }
.chat .rw { color: var(--raid-warning); } .chat .rl { color: var(--raid-leader); } .chat .ra { color: var(--raid); }
.chat .sys { color: var(--system); } .chat .add { color: #ffd100; } .chat .pa { color: var(--party); }
.chat .code { opacity: .75; }

/* Minimap */
.minimap { position: absolute; right: 24px; top: 20px; width: 180px; height: 180px; z-index: 4; }
.minimap .map { position: absolute; left: 22px; top: 22px; width: 136px; height: 136px; border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, #6d4a2a, #3a2414 60%, #1b0f08); box-shadow: inset 0 0 20px #000; }
.minimap .ring { position: absolute; inset: 14px; border-radius: 50%; border: 6px solid #6d6150; box-shadow: 0 0 0 2px #1b1b1b, inset 0 0 0 2px #2a2a2a; }
.minimap .zone { position: absolute; left: 30px; right: 30px; top: -2px; text-align: center; color: var(--gold); font-size: 12px; }
.mm-btn { position: absolute; width: 33px; height: 33px; border: 0; padding: 0; cursor: pointer; background: none; }
.mm-btn .mm-ico { position: absolute; left: 7px; top: 6px; width: 20px; height: 20px; border-radius: 50%; background-size: cover; }

.lootframe .lf-title { position: absolute; left: 82px; top: 13px; color: var(--gold); font-size: 12px; }
.lootframe .lf-portrait { position: absolute; left: 9px; top: 7px; width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 45% 40%, #5a2e1a, #1a0a05); }
.lootframe .lf-close { position: absolute; left: 162px; top: 9px; width: 18px; height: 18px; }
.lootframe .lf-slots { position: absolute; left: 24px; top: 74px; width: 150px; }
.lootframe .lf-slot { display: flex; gap: 6px; align-items: center; height: 36px; margin-bottom: 0; }
.lootframe .lf-slot .icon { width: 32px; height: 32px; }
.lootframe .lf-slot .lf-name { font-size: 11px; line-height: 1.15; width: 112px; }
.lootframe .lf-page { position: absolute; left: 26px; bottom: 18px; color: var(--gold); font-size: 11px; display: flex; gap: 8px; align-items: center; }
.lootframe .lf-arrow { display: inline-block; padding: 0; cursor: pointer; font-family: inherit; width: 18px; height: 18px; border-radius: 50%; background: #3a0e08; border: 1px solid #a88d3b; color: var(--gold); text-align: center; line-height: 16px; font-size: 10px; }

.muted { color: #b9b9b9; }
.hint { color: #b9b9b9; font-family: "ArialN", sans-serif; font-size: 13px; }
.note-bar { padding: 5px 8px; background: rgba(255,209,0,.08); border: 1px solid #ffd10033; color: var(--gold); font-family: "ArialN", sans-serif; font-size: 13px; }
.note-bar.warn { background: rgba(255,160,32,.10); border-color: #ffa02055; color: var(--amber); }
.note-bar.bad { background: rgba(255,60,60,.10); border-color: #ff5a5a55; color: #ff8080; }
.note-bar.good { background: rgba(30,255,0,.07); border-color: #1eff0044; color: #9dff8a; }
.linkish { color: #7fc8ff; text-decoration: underline; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #ffd10055; border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
/* A long list scrolls inside its window, as a game scroll frame does */
.scroll-list { max-height: 510px; overflow-y: auto; padding-right: 6px; scrollbar-width: thin; scrollbar-color: #a88d3b #140c06; }
.warn-btn { background: none; border: 0; padding: 0 2px; font-size: 14px; cursor: pointer; }

.rb { display:inline-block; width:14px; height:14px; border-radius:50%; border:2px solid #a88d3b; background:#120a04; vertical-align:-2px; margin-right:6px; flex:none; box-shadow: inset 0 0 2px #000; }
.rb.on { background: radial-gradient(circle, #ffd100 0 3px, #120a04 4px); }
table.list tr.hl-sel td { background: rgba(255,209,0,.10); }
.pick-list { text-align:left; margin: 4px 6px 10px; max-height: 300px; overflow:auto; }
.pick { display:flex; align-items:center; gap:2px; padding:5px 6px; cursor:pointer; border:1px solid transparent; font-family:"ArialN",sans-serif; font-size:14px; }
.pick.on { background: rgba(255,209,0,.12); border-color:#ffd10044; }
.ask-corner { font-family:"ArialN",sans-serif; font-size:14px; } .ask-corner p { margin:4px 0 8px; } .ask-corner .pick-list { margin:4px 0 8px; }
.split { display:grid; grid-template-columns: 290px 1fr; gap: 14px; }
.split-r { border-left:1px solid #ffd10022; padding-left:14px; }
.side-list { display:flex; flex-direction:column; gap:2px; }
.side-item { text-align:left; background:none; border:1px solid transparent; padding:5px 8px; color:#fff; font:14px "ArialN",sans-serif; cursor:pointer; }
.side-item:hover { background: rgba(255,255,255,.05); }
.side-item.on { background: rgba(255,209,0,.12); border-color:#ffd10055; }
.side-item:focus-visible, .pick:focus-within { outline:2px solid #fff; outline-offset:1px; }
.cols2 { display:grid; grid-template-columns: 1.15fr 1fr; gap: 18px; }
.cols2 > div + div { border-left:1px solid #ffd10022; padding-left:16px; }
tr.pickrow { cursor:pointer; } tr.pickrow:hover td { background: rgba(255,255,255,.04); }
tr.pickrow:focus-visible, .mi[data-goto]:focus-visible { outline:2px solid #fff; outline-offset:-2px; }
.mi[data-goto] { cursor:pointer; }
.tip.menu { background: rgba(9,9,24,.99); z-index: 40; }
.tip.menu .mi .chk { flex:none; position:relative; height:12px; }
.tip.menu .mi .chk.on::after { content:""; position:absolute; left:3px; top:0; width:4px; height:8px; border:solid var(--gold); border-width:0 2px 2px 0; transform:rotate(45deg); }
.tip.menu .mi .white { max-width: 250px; overflow: hidden; text-overflow: ellipsis; }
.notice { background-clip: border-box !important; }
</style></head>

  const ico = o.ico ? `<img class="ico" alt="" src="${o.ico}">` : "";
  return `<button type="button" class="btn ${o.size || ""}" ${attrs}>${ico}${label}</button>`;
}
function mode(kind, text) { return `<span class="mode ${kind}">${esc(text)}</span>`; }
function frame({ id = "", title = "", body = "", x, y, w, cls = "", close = true, after = "" }) {

    ${title ? `<div class="frame-header">${title}</div>` : ""}
    ${close ? `<button type="button" class="frame-close" aria-label="Close" data-goto="__close"></button>` : ""}

}
function tip(html, x, y, w) { return `<div class="tip" style="left:${x}px;top:${y}px;${w ? `width:${w}px` : ""}">${html}</div>`; }

/* ---------- The game's own loot window ---------- */
function lootframe(keys, o = {}) {
  const page = o.page || 0, pages = Math.ceil(keys.length / 4);
  const slots = keys.slice(page * 4, page * 4 + 4).map((k) => `<div class="lf-slot" data-slot>${icon(k)}<span class="lf-name q-${ITEMS[k].q}">${esc(ITEMS[k].name)}</span></div>`).join("");
  const arrow = (to, ch, label) => `<button type="button" class="lf-arrow" data-page="${to}" aria-label="${label}">${ch}</button>`;
  const pager = pages > 1 ? `<div class="lf-page">${page > 0 ? arrow(page - 1, "◀", "Previous loot page") : ""}<span>Page ${page + 1} of ${pages}</span>${page < pages - 1 ? arrow(page + 1, "▶", "Next loot page") : ""}</div>` : "";
  return `<div class="lootframe" style="left:${o.x ?? 60}px;top:${o.y ?? 210}px" aria-label="The game's loot window">

}

/* Variants of a corpse for each pop-up state */
function popupModel(state) {
  let m;
  switch (state) {
    case "popup-typical": return corpse("typical");
    case "popup-crowded": return corpse("crowded");
    case "popup-page2": m = corpse("crowded"); m.page = 1; return m;
    case "popup-boss": m = corpse("typical"); m.boss = "Trash"; m.bossMenu = true; m.bossNote = "These items drop from more than one boss. Pick the boss before awarding."; return m;
    case "popup-no-reserves": m = corpse("typical"); m.noReserves = true;
      m.items.forEach((e) => { e.kind = "open"; e.label = "Open roll"; e.note = "No reserves loaded"; e.action = "openroll"; delete e.winner; delete e.contenders; }); return m;
    case "popup-fight": m = corpse("typical"); m.fight = true; return m;
    case "popup-unavailable": m = corpse("typical");
      m.items[0].winner = "Unknown"; m.items[0].unavailable = "Ashla Brightwater's name hasn't loaded yet (shown as \"Unknown\"). Try again in a moment.";
      m.items[1].skipped = [["Doran Vale", "the game won't let them receive this item (usually: not nearby when the boss died)"]];
      m.items[1].kind = "open"; m.items[1].label = "Open roll"; m.items[1].note = "No one else reserved it"; m.items[1].action = "openroll"; delete m.items[1].winner; m.items[1].contenders = [];
      return m;
    case "popup-db": m = corpse("typical"); m.dbMenu = 2; return m;
    case "roll-called": m = corpse("crowded"); m.focus = 0;
      Object.assign(m.items[0], { stage: "rolling", rolls: [["Mirel Stone", 87], ["Ashla Brightwater", 42], ["Ysolde Marr", 15]], waiting: ["Tovin Hale"],
        ignored: [["Quill Ashby", 99, "not eligible"], ["Ashla Brightwater", 96, "second roll, the first counts"]] }); return m;
    case "roll-tie": m = corpse("crowded"); m.focus = 0;
      Object.assign(m.items[0], { stage: "tie", rolls: [["Mirel Stone", 87], ["Tovin Hale", 87], ["Ashla Brightwater", 42], ["Ysolde Marr", 15]], tie: ["Mirel Stone", "Tovin Hale"] }); return m;
    case "roll-hidden": m = corpse("crowded"); m.focus = 0; Object.assign(m.items[0], { stage: "hidden" }); return m;
    case "handout-waiting": m = corpse("typical"); m.focus = 0; m.items[0].stage = "waiting"; return m;
    case "not-confirmed": m = corpse("typical"); m.focus = 0; m.items[0].stage = "notconfirmed"; return m;
    case "give-else": m = corpse("typical"); m.focus = 0; m.items[0].stage = "giveelse"; return m;
    case "practice": m = corpse("typical"); m.practice = true; m.boss = "Test drop"; m.testDrop = true;
      m.items[0].winner = "Konvett Konvett"; m.items[0].contenders = ["Konvett Konvett"];
      m.items[1].kind = "hr"; m.items[1].label = "Hard reserve roll-off"; m.items[1].action = "roll"; m.items[1].contenders = ["Konvett Konvett", "Seraphine Ashdown"]; delete m.items[1].winner;
      return m;
  }
  return null;
}

function awardActions(a, readOnly) {
  const dis = readOnly ? { disabled: true, title: "Only the loot master (Konvett Konvett) can change awards." } : {};
  if (a.status === "notconfirmed") return `<div class="btn-row">${btn("Try again", { size: "tiny", ...dis })}${btn("Someone else", { size: "tiny", ...dis, goto: readOnly ? "" : "give-else" })}${btn("Not handed out", { size: "tiny", ...dis })}</div>`;

function awardWinner(a) {

/* ---------- Scene assembly and switcher ---------- */
/* ---------- Revision 2: the raid question and the Sync tab (design #44) ----------
   Sample data only. Shared content; each version (SYNC_V) decides layout and how the question is asked. */
const ME = "Konvett Konvett";            /* the officer at this screen, the loot master */
const OTHER = "Seraphine Ashdown";        /* another officer, for the follower view */
const RAIDS = {
  mc: { name: "Molten Core", day: "Thu 10 Dec", when: "Under way since 19:30", live: true, inst: 409, zone: "Molten Core", players: 38, reserves: 61, awards: 12, undo: 1, src: "helper" },
  ony: { name: "Onyxia's Lair", day: "Thu 10 Dec", when: "Starts 22:00", inst: 249, zone: "Onyxia's Lair", players: 40, reserves: 14, awards: 0, src: "helper" },
  mc2: { name: "Molten Core: second team", day: "Thu 10 Dec", when: "Under way since 19:45", live: true, inst: 409, zone: "Molten Core", players: 22, reserves: 30, awards: 0, src: "helper" },
  zg: { name: "Zul'Gurub alt run (custom raid with a very long name)", day: "Thu 10 Dec", when: "Starts 21:00", inst: null, players: 12, reserves: 9, awards: 0, src: "helper" },
  bwl: { name: "Blackwing Lair", day: "Wed 9 Dec", when: "Ended 23:10 yesterday", inst: 469, zone: "Blackwing Lair", players: 39, reserves: 58, awards: 3, src: "pasted", pasted: "19:42" },
};
const rname = (id) => `${RAIDS[id].name}, ${RAIDS[id].day}`;

/* Per state: which raids are loaded, which is selected, by whom, where the officer is */
function syncModel(state) {
  const m = { list: ["mc", "ony"], sel: "mc", by: ME, at: "19:31", zone: "Molten Core", inst: 409, helper: true, viewer: ME, noraid: 0 };
  switch (state) {
    case "ask-guild": case "ask-raid": case "ask-fallback": Object.assign(m, { sel: null, by: null }); break;
    case "ask-overlap": Object.assign(m, { list: ["mc", "mc2", "ony"], sel: null, by: null }); break;
    case "ask-nomatch": Object.assign(m, { sel: null, by: null, zone: "Zul'Gurub", inst: 309 }); break;
    case "ask-again": Object.assign(m, { zone: "Onyxia's Lair", inst: 249 }); break;
    case "sync-follower": m.viewer = OTHER; break;
    case "sync-off": Object.assign(m, { sel: "off" }); break;
    case "sync-undecided": Object.assign(m, { sel: null, by: null, noraid: 2 }); break;
    case "sync-crowded": Object.assign(m, { list: ["mc", "mc2", "ony", "zg", "bwl"] }); break;
    case "sync-gone": Object.assign(m, { list: ["ony"], sel: null, by: null, gone: "mc" }); break;
    case "sync-empty": Object.assign(m, { list: [], sel: null, by: null, helper: false, zone: null, inst: null }); break;
    case "sync-pasted": case "sync-remove": case "sync-refused":
      RAIDS.mcp = Object.assign({}, RAIDS.mc, { src: "pasted", pasted: "19:42" });
      Object.assign(m, { list: ["mcp"], sel: "mcp", helper: false, pastedSel: true }); break;
    case "sync-noraid": case "sync-discard": Object.assign(m, { noraid: 3 }); break;
  }
  return m;
}

/* ----- Shared pieces ----- */
function radio(on, label, o = {}) {
  return `<span class="rb ${on ? "on" : ""}" role="radio" aria-checked="${on}" ${o.disabled ? 'aria-disabled="true"' : ""}></span>${label}`;
}
function raidFacts(id, o = {}) {
  const r = RAIDS[id];
  const inst = r.inst ? `Instance ${r.inst}` : `<span class="amber">No instance number</span>`;
  const src = r.src === "pasted" ? `Pasted ${r.pasted}` : "From the helper";
  return o.short ? `${esc(r.when)} · ${r.players} players` : `${esc(r.when)} · ${inst} · ${r.players} players · ${r.reserves} reserves · ${src}`;
}
function chosenLine(m) {
  if (m.sel === "off") return m.by === m.viewer ? `You chose this at ${m.at}.` : `${who(m.by)} (loot master) chose this at ${m.at}.`;
  if (!m.by) return "";
  const by = m.by === m.viewer ? "you" : `${who(m.by)} (loot master)`;
  return m.pastedSel ? `Chosen when you pasted its reserves at 19:50.` : `Chosen by ${by} at ${m.at}. Awards from this group go to this raid.`;
}
function whereLine(m) {
  if (!m.inst) return `<span class="hint">You're not in an instance.</span>`;
  return `<span class="hint">You're in ${esc(m.zone)} (instance ${m.inst}).</span>`;
}
function statusBar(m) {
  if (m.sel === "off") return `<div class="note-bar"><b>Not a guild run.</b> The add-on is off for this group: no loot pop-up, no chat lines, nothing recorded. It turns back on when you leave the group.<div class="row hint" style="margin-top:4px">${chosenLine(m)}<span class="spacer"></span>${btn("It's a guild run", { size: "tiny", goto: "ask-raid" })}</div></div>`;
  if (m.gone) return `<div class="note-bar warn"><b>No raid chosen.</b> ${esc(rname(m.gone))} has left the helper's list. Awards are held as "no raid" until a raid is chosen.</div>`;
  if (!m.list.length) return `<div class="note-bar warn"><b>No raids loaded.</b> The pop-up still works, but every item is an open roll.</div>`;
  if (!m.sel) return `<div class="note-bar warn"><b>No raid chosen yet.</b> Awards are held as "no raid" until you choose one. ${btn("Choose the raid", { size: "tiny", goto: "ask-raid" })}</div>`;
  const r = RAIDS[m.sel];
  return `<div class="note-bar good"><b>${esc(rname(m.sel))}</b> · ${r.players} players · ${r.reserves} reserves · ${r.awards} awards<div class="hint" style="margin-top:2px;color:#cfe9c9">${chosenLine(m)}</div></div>`;
}
function helperLine(m) {
  return m.helper
    ? `<div class="row hint"><img class="dot" alt="" src="${ASSET.dotGreen}"> Desktop helper in use: raid events read at 19:28 (they update at login or /reload), and awards go to the site live.</div>`
    : `<div class="row hint"><img class="dot" alt="" src="${ASSET.dotGray}"> Desktop helper not running: paste reserves in and copy awards out below.</div>`;
}
function pasteBox(m, state) {
  const refused = state === "sync-refused";
  return `<div class="gold" style="margin:2px 0 4px">Reserves in</div>
    <div class="hint" style="margin-bottom:4px">On the guild site, open the raid and choose <b class="white">Copy reserves</b>. Paste it here with Ctrl+V (Cmd+V on Mac). Pasting chooses that raid for the group.</div>
    <textarea class="input" rows="2" aria-label="Paste reserves" placeholder="Paste the reserves text here">${refused ? "BFSNAP2:1/1:{formatVersion=2,raid=&quot;cm9xr2k4a0001&quot;..." : ""}</textarea>
    <div class="row" style="margin-top:6px">${btn("Load", { goto: m.list.length ? "" : "sync-pasted" })}</div>
    ${refused ? `<div class="note-bar bad" style="margin-top:8px">This text needs a newer version of the add-on (you have 1.2.1). Nothing was loaded; your raids are unchanged.</div>
      <div class="row" style="margin-top:6px"><span class="hint">Download link:</span><input class="input selected-text" style="flex:1" readonly aria-label="Download link" value="https://github.com/robpaolella/bureaucracy-forever-addon/releases/latest"></div>
      <div class="hint" style="margin-top:4px">Press Ctrl+C to copy the link, open it in your browser, replace the add-on folder, then /reload.</div>` : ""}`;
}
function raidPicker(m, label) {
  const id = m.sel && m.sel !== "off" ? m.sel : m.list.find((x) => RAIDS[x].awards) || m.list[0];
  return `<span class="hint">${label}</span> <button type="button" class="dd" aria-haspopup="listbox">${id ? esc(rname(id)) : "No raids"}</button>`;

function awardsOut(m, state) {
  const id = m.sel && m.sel !== "off" ? m.sel : null;
  const has = id && RAIDS[id].awards;
  const selected = state === "sync-pasted";
  return `<div class="gold" style="margin-bottom:4px">Awards out</div>
    <div class="hint" style="margin-bottom:6px">${m.helper ? "Not needed while the desktop helper runs. " : ""}Paste the text into <b class="white">Import awards</b> on the raid's page on the guild site.</div>
    ${selected ? `<div class="hint" style="margin-bottom:4px">The text is selected: press Ctrl+C (Cmd+C on Mac).</div><textarea class="input selected-text" rows="2" aria-label="Awards to copy" readonly>BFOUT1;cm9xr2k4a0001;PA0001;production
A;19-4410;lb_lucifron;19837;Ashla Brightwater;u_ana;HR;;;Konvett Konvett;1792001520;...</textarea><div style="height:6px"></div>` : ""}
    <div class="row">${m.list.length ? raidPicker(m, "Raid:") : ""}${btn("Copy awards", { disabled: !has, goto: has ? "sync-pasted" : "" })}<span class="hint">${has ? "12 awards, 1 undo. Practice awards are never included." : "Nothing to copy yet."}</span></div>`;
}
function noraidBlock(m) {
  if (!m.noraid) return "";

    <div class="row" style="margin:8px 0 4px">${m.list.length ? raidPicker(m, "Attach to:") : ""}${btn("Attach", { disabled: !m.list.length })}${btn("Discard", { goto: "sync-discard" })}<span class="spacer"></span></div>
    <div class="hint" style="margin-bottom:8px">Methods stay as recorded; fix any on the site afterwards. Discard if they were from a run that wasn't a guild run.</div>`;

/* ----- The questions ----- */
function askList(m, pre, o = {}) {
  const rows = m.list.map((id) => {
    const r = RAIDS[id]; const on = id === pre;
    const match = r.inst && r.inst === m.inst && (r.live || r.when.startsWith("Starts"));
    return `<label class="pick ${on ? "on" : ""}" tabindex="0">${radio(on, `<span class="col" style="gap:0;text-align:left"><span class="white">${esc(rname(id))}${match ? ` <span class="mode ok">Matches</span>` : ""}</span><span class="hint" style="font-size:12px">${raidFacts(id, { short: true })}</span></span>`)}</label>`;
  }).join("");
  const off = o.withOff ? `<div class="hr-div"></div><label class="pick" tabindex="0" data-off="1">${radio(false, `<span class="col" style="gap:0;text-align:left"><span class="white">No, not a guild run</span><span class="hint" style="font-size:12px">The add-on stays off until you leave the group</span></span>`)}</label>` : "";
  return `<div class="pick-list" role="radiogroup" aria-label="Raid events">${rows}${off}</div>`;
}
function askContent(state, m, flow) {
  /* returns { title, body, buttons } for one step of the question */
  const where = `You've entered <b class="white">${esc(m.zone)}</b> with a raid group.`;
  const fallback = state === "ask-fallback" ? `<div class="note-bar warn" style="margin:6px 0;text-align:left">You're asked because master loot is off and you lead the raid. Turn master loot on to hand out items with the pop-up.</div>` : "";
  if (state === "ask-again") return { title: "Bureaucracy Forever", body: `<p>You've entered <b class="white">${esc(m.zone)}</b>. Switch the raid to <b class="white">${esc(rname("ony"))}</b>?</p><p class="hint">Your 12 Molten Core awards stay with that raid and are still sent to the site.</p>`,
    buttons: btn("Switch", { goto: "sync-chosen" }) + btn("Keep Molten Core", { goto: "sync-chosen" }) + btn("Not a guild run", { goto: "sync-off" }) };
  if (flow === "one") {
    const pre = state === "ask-overlap" || state === "ask-nomatch" ? null : "mc";
    const lead = state === "ask-overlap" ? `<p>${where} Two raid events for Molten Core are under way. Which one is this?</p>`
      : state === "ask-nomatch" ? `<p>${where}</p><p class="hint">No raid event is set for Zul'Gurub (instance 309). If this is a custom raid, an officer can enter 309 as its In-game instance number on the guild site.</p>`
      : `<p>${where} If it's a guild run, pick its raid event. If not, choose the last option.</p>`;
    return { title: "Is this a guild run?", body: `${lead}${fallback}${askList(m, pre, { withOff: true })}`,
      buttons: btn("Start", { disabled: !pre, goto: "sync-chosen" }) + btn("Later", { goto: "sync-undecided" }) };
  }
  if (state === "ask-guild" || state === "ask-fallback") return { title: "Is this a guild run?", body: `<p>${where} Is this a guild run?</p>${fallback}<p class="hint">If not, the add-on stays off until you leave the group: no loot pop-up, nothing recorded.</p>`,
    buttons: btn("Guild run", { goto: "ask-raid" }) + btn("Not a guild run", { goto: "sync-off" }) + btn("Later", { goto: "sync-undecided" }) };
  const pre = state === "ask-raid" ? "mc" : null;
  const lead = state === "ask-overlap" ? `<p>Two raid events for Molten Core are under way. Which one is this?</p>`
    : state === "ask-nomatch" ? `<p>No raid event is set for <b class="white">Zul'Gurub</b> (instance 309). Which one is this?</p><p class="hint">If it's a custom raid, an officer can enter 309 as its In-game instance number on the guild site.</p>`
    : `<p>Which raid event is this?</p>`;
  return { title: "Which raid event?", body: `${lead}${askList(m, pre)}`,
    buttons: btn("Start", { disabled: !pre, goto: "sync-chosen" }) + btn("Back", { goto: "ask-guild" }) + btn("Later", { goto: "sync-undecided" }) };
}
function askDialog(state, m, V) {
  const c = askContent(state, m, V.flow);
  if (V.askAt === "corner") {
    return frame({ id: "ask", title: c.title, x: 1050, y: 236, w: 360, close: false,
      body: `<div class="ask-corner">${c.body}<div class="btn-row">${c.buttons}</div></div>` });
  }
  return notice(`<div class="gold" style="font-size:14px;margin-bottom:2px">${esc(c.title)}</div>${c.body}`, c.buttons, { label: c.title, top: 200, w: 480 });
}

/* Confirmation dialogs (same in every version) */
function syncDialog(state) {
  switch (state) {
    case "sync-switch": return notice(`<p>Switch the raid to <b class="white">${esc(rname("ony"))}</b>?</p><p class="hint">You have 12 awards for Molten Core. They stay with that raid and are still sent to the site. Every officer in the group switches too.</p>`,
      btn("Switch", { goto: "sync-chosen" }) + btn("Keep Molten Core", { goto: "sync-chosen" }), { top: 260, label: "Switch raid" });
    case "sync-gone": return notice(`<p><b class="white">${esc(rname("mc"))}</b> has left the helper's list: it was cancelled or has ended.</p><p class="hint">Its 12 awards are kept and still sent to the site. You'll be asked which raid it is when you next enter a raid instance.</p>`,
      btn("Choose a raid now", { goto: "ask-raid" }) + btn("OK", { goto: "__close" }), { top: 260, label: "Raid left the list" });
    case "sync-remove": return notice(`<p>Remove <b class="white">${esc(rname("mc"))}</b>?</p><p class="hint">Its 12 awards stay saved and can still be copied.</p>`,

    case "sync-discard": return notice(`<p>Discard <b class="white">3 awards</b> that aren't linked to a raid?</p><p class="hint">They were never sent to the site. This can't be undone.</p>`,
      btn("Discard", { goto: "sync-chosen" }) + btn("Cancel", { goto: "sync-noraid" }), { top: 260, label: "Discard awards" });
  }
  return "";
}

    <button type="button" id="prev">◀ Previous</button><button type="button" id="next">Next ▶</button>
    <label>Theme <select id="theme-select"><option value="default">Default (the game has one look)</option></select></label>
    <span class="proto-note">${V.blurb} Buttons inside the game windows move between states where it makes sense.</span>`;

    const vw = document.documentElement.clientWidth; const s = Math.min(1, vw / 1440);
    let h = 900; const top = scene.getBoundingClientRect().top;
    scene.style.height = "auto";
    for (const el of scene.querySelectorAll(".frame, .tip, .chat, .lootframe")) h = Math.max(h, (el.getBoundingClientRect().bottom - top) / s + 70);
    scene.style.height = h + "px";
    scene.style.transform = `scale(${s})`; document.getElementById("viewport").style.height = h * s + "px";
  }
  function render(push) {
    if (push !== "view") VIEW = {};
    scene.innerHTML = `<div class="scene-caption">${esc(LABELS[state])}</div>` + sceneFor(state, V);
    sel.value = state;
    const u = new URL(location.href); u.searchParams.set("state", state); u.searchParams.set("theme", theme);
    if (push) history.replaceState(null, "", u);
    fit();
    document.documentElement.dataset.state = state; document.documentElement.dataset.theme = theme;
  }
  sel.addEventListener("change", () => { state = sel.value; render(true); });
  document.getElementById("prev").addEventListener("click", () => { state = STATE_IDS[(STATE_IDS.indexOf(state) + STATE_IDS.length - 1) % STATE_IDS.length]; render(true); });

  });
  window.addEventListener("resize", fit);

      <div class="gold small" style="margin-bottom:4px">Give ${link("choker")} to someone else</div>
      <table class="list"><tbody>
        <tr><td>${who("Doran Vale")}</td><td>${mode("sr", "Soft reserve")}</td><td style="text-align:right">${btn("Give", { size: "tiny", goto: "handout-waiting" })}</td></tr>
        <tr><td>${who("Mirel Stone", { absent: true })}</td><td class="grey small">not in raid</td><td></td></tr>
        <tr><td>Open roll</td><td class="hint">everyone can roll</td><td style="text-align:right">${btn("Call open roll", { size: "tiny", goto: "roll-called" })}</td></tr>
        <tr><td>Disenchant/bank</td><td>${who("Edric Moss")}</td><td style="text-align:right">${btn("Give", { size: "tiny", goto: "handout-waiting" })}</td></tr>
      </tbody></table>
      <div class="hint" style="margin-top:4px">Posts: Correction: ${link("choker")} was not handed to Ashla Brightwater, then the new award line.</div></div>`;
  }
  return "";
}
function stagePanel(e, o) { return rollPanel(e, o) || handoutPanel(e, o); }

function bossControl(m) {
  const menu = m.bossMenu ? `<div class="tip menu" style="left:44px;top:22px;width:220px"><div class="menu-title">Which boss dropped this?</div>
      ${["Trash", "Lucifron", "Magmadar", "Gehennas"].map((b) => `<div class="mi ${b === "Lucifron" ? "sel" : ""}"><span class="chk">${b === "Trash" ? "✓" : ""}</span><span class="white">${b}</span>${b === "Lucifron" ? '<span class="hint">· killed 20:01</span>' : ""}</div>`).join("")}</div>` : "";
  return `<span style="position:relative" class="row"><span class="gold small">Boss:</span><button type="button" class="dd" data-goto="${m.bossMenu ? "popup-typical" : "popup-boss"}">${esc(m.boss)}</button>${menu}</span>`;
}
function banners(m) {
  let s = "";
  if (m.practice) s += `<div class="note-bar" style="margin-bottom:6px">${mode("practice", "Practice")} Test drop: no corpse, reserves are made up, nothing is handed out or sent to the site.</div>`;
  if (m.noReserves) s += `<div class="note-bar warn" style="margin-bottom:6px">No reserves loaded, so every item is an open roll. <button type="button" class="linkish" data-goto="sync-empty">Load reserves</button></div>`;
  if (m.fight) s += `<div class="note-bar warn" style="margin-bottom:6px">Boss fight in progress. The game locks chat for add-ons, so awards wait until it ends.</div>`;
  if (m.bossNote) s += `<div class="note-bar" style="margin-bottom:6px">${esc(m.bossNote)}</div>`;
  return s;
}
function statusLine(m) {
  return `<div class="hint" style="font-size:12px;margin-top:6px">${m.noReserves ? "Reserves: none loaded" : esc(STATUS_LINE)}${m.practice ? " · <span class='gold'>practice</span>" : ""}</div>`;
}
function popupTitle(m) { return `${m.practice ? "[Practice] " : ""}Loot · ${esc(m.boss)}`; }
/* The three pop-up layouts. Exactly one is used per built file (VERSION is set by the build). */
"use strict";

const VERSIONS = {};

/* A: list beside the loot window; roll-offs open inside the item's row. Awards listed by time. */
VERSIONS.a = {
  letter: "A", name: "List beside the loot window", groupAwards: false,
  blurb: "Pop-up: one row per item beside the game's loot window; a roll-off opens inside its row. Awards tab: one list by time.",
  popup(m, state) {
    const rows = m.items.map((e, i) => {
      const dbOpen = m.dbMenu === i;
      return `${i ? '<div class="hr-div"></div>' : ""}<div class="row" style="align-items:flex-start;gap:10px;padding:2px 0">
        ${icon(e.key)}
        <div class="col" style="flex:1;gap:2px;min-width:0">
          <div class="row" style="gap:6px">${link(e.key)}${e.copy ? `<span class="hint">· ${esc(e.copy)}</span>` : ""}</div>
          <div class="row" style="gap:6px;flex-wrap:wrap">${modeTag(e)} ${contendersLine(e)}</div>
          ${skippedLines(e)}
          ${e.unavailable ? `<div class="note-bar warn">${esc(e.unavailable)}</div>` : ""}
          ${stagePanel(e)}
        </div>
        <div class="col" style="align-items:flex-end;gap:4px">${e.stage ? "" : primaryButtons(e, m)}${e.stage ? "" : dbButton(e, dbOpen, m)}</div>
      </div>`;
    }).join("");
    const head = `<div class="row" style="margin-bottom:6px">${bossControl(m)}<span class="spacer"></span><span class="hint">${m.items.length} items</span></div>`;
    const body = `${banners(m)}${head}<div class="scroll-list" tabindex="0" aria-label="Items on this corpse">${rows}</div>${statusLine(m)}`;
    const lf = lootframe(m.loot, { page: m.page, title: m.testDrop ? "Test drop" : m.boss });
    const x = state === "practice" ? 60 : 330, y = state === "practice" ? 130 : 150;
    return (state === "practice" ? "" : lf) + frame({ id: "popup", title: popupTitle(m), x, y, w: 560, body });
  },
};

/* B: one item at a time with a queue of the rest; roll-offs inside the card. Awards grouped by boss. */
VERSIONS.b = {
  letter: "B", name: "One item at a time", groupAwards: true,
  blurb: "Pop-up: a larger card for the current item, with the rest queued along the top. Awards tab: grouped by boss.",
  popup(m, state) {
    const f = m.focus ?? 0; const e = m.items[f];
    const queue = m.items.map((x, i) => `<button type="button" class="q-tab" data-focus="${i}" style="position:relative;background:none;border:0;padding:2px;cursor:pointer" aria-label="${esc(ITEMS[x.key].name)}" aria-current="${i === f}">
        <span style="display:block;outline:${i === f ? "2px solid var(--gold)" : "none"};outline-offset:1px">${icon(x.key, "m")}</span>
        <span class="mode ${x.kind === "hr" ? "hr" : x.kind === "sr" ? "sr" : "open"}" style="position:absolute;left:0;right:0;bottom:-10px;font-size:8px;padding:0 1px;text-align:center">${x.kind === "hr" ? "HR" : x.kind === "sr" ? "SR" : "Roll"}</span></button>`).join("");
    const list = e.action === "roll"
      ? `<table class="list"><tbody>${e.contenders.map((n) => `<tr><td>${who(n)}</td><td class="hint" style="text-align:right">${e.stage ? "" : "will roll"}</td></tr>`).join("")}</tbody></table>`
      : e.action === "give" ? `<div class="row" style="font-family:ArialN,sans-serif;font-size:16px">${who(e.winner)} <span class="hint">reserved it${e.kind === "sr" ? " (soft)" : ""}</span></div>`
      : `<div class="hint">${esc(e.note || "")}. Everyone can roll.</div>`;
    const card = `<div class="row" style="gap:12px;align-items:flex-start">${icon(e.key, "l")}
        <div class="col" style="flex:1;gap:4px"><div style="font-size:16px">${link(e.key)}</div>
          <div class="row" style="gap:6px">${modeTag(e)}${e.copy ? `<span class="hint">${esc(e.copy)}</span>` : ""}</div></div></div>
      <div style="margin:8px 0 4px">${e.stage && e.action === "roll" ? "" : list}</div>
      ${skippedLines(e)}
      ${e.unavailable ? `<div class="note-bar warn" style="margin-top:4px">${esc(e.unavailable)}</div>` : ""}
      ${stagePanel(e, { boxed: true })}
      ${e.stage ? "" : `<div class="row" style="margin-top:10px">${primaryButtons(e, m, { big: true })}<span class="spacer"></span>${dbButton(e, m.dbMenu !== undefined, m)}</div>`}`;
    const nav = `<div class="row" style="margin-top:10px">${btn("◀", { size: "tiny", title: "Previous item", focus: (f + m.items.length - 1) % m.items.length })}<span class="hint">Item ${f + 1} of ${m.items.length}</span>${btn("▶", { size: "tiny", title: "Next item", focus: (f + 1) % m.items.length })}<span class="spacer"></span>${bossControl(m)}</div>`;
    const body = `${banners(m)}<div class="row" style="gap:6px;margin-bottom:14px;flex-wrap:wrap">${queue}</div><div class="boxed" style="padding:4px">${card}</div>${nav}${statusLine(m)}`;
    const lf = lootframe(m.loot, { page: m.page, title: m.testDrop ? "Test drop" : m.boss });
    const x = state === "practice" ? 60 : 330, y = state === "practice" ? 130 : 150;
    return (state === "practice" ? "" : lf) + frame({ id: "popup", title: popupTitle(m), x, y, w: 480, body });
  },
};

/* C: labels attached to the game's own loot window; details and roll-offs in a small side window. Awards listed by time. */
VERSIONS.c = {
  letter: "C", name: "Labels on the game's loot window", groupAwards: false,
  blurb: "Pop-up: small labels attached to each slot of the game's own loot window, with roll-offs and details in a small window beside it. Awards tab: one list by time.",
  popup(m, state) {
    const LX = 60, LY = 230;
    const page = m.page || 0, first = page * 4;
    const visible = m.items.slice(first, first + 4);
    const focus = m.focus ?? (m.dbMenu !== undefined ? m.dbMenu : -1);
    const labels = visible.map((e, j) => {
      const i = first + j;
      const top = LY + 74 + 36 * j + 1;
      const what = e.action === "give" ? who(e.winner) : e.action === "roll" ? `<span class="hint">${e.contenders.length} roll</span>` : `<span class="hint">anyone</span>`;
      const act = e.stage ? `<span class="${e.stage === "notconfirmed" || e.stage === "tie" ? "amber" : "gold"} small">${e.stage === "waiting" ? '<span class="spinner"></span>' : e.stage === "notconfirmed" ? "Not confirmed ▸" : e.stage === "tie" ? "Tie ▸" : "Rolling ▸"}</span>`
        : `${e.action === "give" ? btn("Give", { size: "tiny", goto: m.fight || e.unavailable ? "" : "handout-waiting", disabled: m.fight || !!e.unavailable }) : btn("Roll", { size: "tiny", ico: ASSET.dice, goto: m.fight ? "" : "roll-called", disabled: m.fight })}
           <span style="position:relative;display:inline-block">${btn("", { size: "tiny", ico: ASSET.de, goto: m.dbMenu === i ? "popup-typical" : "popup-db", title: "Disenchant/bank: Edric Moss" })}${m.dbMenu === i ? dbMenu() : ""}</span>`;
      const warn = e.unavailable || (e.skipped && e.skipped.length) ? `<button type="button" class="warn-btn amber" data-focus="${i}" title="${esc(e.unavailable || e.skipped.map((s) => s[0] + ": " + s[1]).join("; "))}" aria-label="Details for ${esc(ITEMS[e.key].name)}">⚠</button>` : "";
      return `<div class="tip row" style="left:${LX + 176}px;top:${top}px;width:330px;height:34px;padding:0 6px;gap:6px;z-index:${m.dbMenu === i ? 25 : 6};${focus === i ? "box-shadow:0 0 0 1px var(--gold)" : ""}">
        ${mode(e.kind === "hr" ? "hr" : e.kind === "sr" ? "sr" : "open", e.kind === "hr" ? "HR" : e.kind === "sr" ? "SR" : "Roll")}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${what}</span>${warn}${act}</div>`;
    }).join("");
    const more = m.items.length > 4 ? `<div class="hint" style="position:absolute;left:${LX + 190}px;top:${LY + 226}px;z-index:6">${page === 0 ? `${m.items.length - 4} more on page 2 of the loot window: labels follow the page` : `Page 2 of the loot window: items 5 to ${m.items.length}`}</div>` : "";
    const strip = `<div class="tip" style="left:${LX}px;top:${LY - 66}px;width:506px;z-index:6">
        <div class="row">${m.practice ? mode("practice", "Practice") : ""}${bossControl(m)}<span class="spacer"></span><span class="hint" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">${m.noReserves ? "Reserves: none loaded" : esc(STATUS_LINE)}</span></div></div>`;
    const bannerHTML = banners(m);
    const bannerBox = bannerHTML ? `<div style="position:absolute;left:${LX}px;top:${LY + 270}px;width:506px;z-index:6">${bannerHTML}</div>` : "";
    /* Side window: shows details for the focused item, roll-offs and hand-out problems */
    let side = "";
    const fe = focus >= 0 && focus < m.items.length && m.dbMenu === undefined ? m.items[focus] : null;
    if (fe) {
      const body = `<div class="row" style="gap:8px">${icon(fe.key, "m")}<div class="col" style="gap:2px">${link(fe.key)}<div class="row" style="gap:6px">${modeTag(fe)}</div></div></div>
        ${skippedLines(fe)}${stagePanel(fe, { boxed: false })}`;
      side = frame({ id: "detail", title: fe.stage === "waiting" || fe.stage === "notconfirmed" || fe.stage === "giveelse" ? "Hand-out" : fe.stage ? "Roll-off" : "Item details", x: 620, y: 200, w: 400, body });
    } else if (state === "popup-crowded" || state === "popup-page2" || state === "popup-unavailable") {
      const withSkips = m.items.filter((e) => (e.skipped && e.skipped.length) || e.unavailable);
      side = frame({ id: "detail", title: "Skipped holders", x: 620, y: 200, w: 400, body: withSkips.map((e) => `<div class="row" style="gap:6px;margin:4px 0">${icon(e.key, "s")}${link(e.key)}</div>${skippedLines(e)}${e.unavailable ? `<div class="note-bar warn">${esc(e.unavailable)}</div>` : ""}`).join("") + `<div class="hint" style="margin-top:6px">Hover or click ⚠ on a label to see one item.</div>` });
    }
    return lootframe(m.loot, { x: LX, y: LY, page, title: m.testDrop ? "Test drop" : m.boss }) + strip + labels + more + bannerBox + side;
  },
};

/* D: Robert's picks combined: A's pop-up with B's Awards grouped by boss. */
VERSIONS.d = Object.assign({}, VERSIONS.a, {
  letter: "D", name: "A's pop-up, Awards grouped by boss", groupAwards: true,
  blurb: "Pop-up: one row per item beside the game's loot window; a roll-off opens inside its row. Awards tab: grouped by boss.",
});

boot(Object.assign({}, VERSIONS.d, SYNC_V.a, { syncKey: "a" }));</script></body></html>
